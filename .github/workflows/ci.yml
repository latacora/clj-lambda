---
name: CI

on:
  push:

jobs:
  # Tests on template itself
  test:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2

      - name: Check outdated dependencies
        uses: liquidz/antq-action@master

  # Tests on project generated by template
  project-test:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2

      - uses: actions/setup-java@5f00602cd1b2819185d88dc7a1b1985f598c6705 # v2.4.0
        with:
          java-version: 11
          distribution: 'zulu'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@0fe110ad5aab7de04967d0f573267f7009aa0609 # 3.6
        with:
          tools-deps: "1.10.3.1040"

      - name: Setup Babashka
        uses: turtlequeue/setup-babashka@fff96c154d5aec91d5bbfbb201c5b20f96653084 # v1.3.0
        with:
          babashka-version: 0.6.8

      - name: Generate project with template
        run: clojure -X:new :name com.example/bar

      - name: Run project's CI job
        run: cd bar && bb ../script/run-workflow-job.clj .github/workflows/ci.yml test
